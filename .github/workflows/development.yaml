name: "Development deployment"

on:
  push:
    branches:
      - "development"
  workflow_dispatch:

jobs:
  ci:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
        env:
          SKIP_ENV_VALIDATION: 1
      - run: npm test
        env:
          SKIP_ENV_VALIDATION: 1

  build-packages:
    name: Build and publish packages
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.DEV_WIF_PROVIDER }}
          service_account: ${{ vars.DEV_WIF_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t ${{ vars.NAME }}:latest .
      - name: Upload the Docker image
        run: |
          gcloud auth configure-docker ${{ vars.DEV_REGION }}-docker.pkg.dev
          docker image tag ${{ vars.NAME }}:latest ${{ vars.DEV_DOCKER_LOCATION }}/${{ vars.NAME }}:latest
          docker push ${{ vars.DEV_DOCKER_LOCATION }}/${{ vars.NAME }}:latest
      - name: Deploy on Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.NAME }}
          image: ${{ vars.DEV_DOCKER_LOCATION }}/${{ vars.NAME }}:latest
          region: ${{ vars.DEV_REGION }}
