name: 'CI'

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
        env:
          SKIP_ENV_VALIDATION: 1
      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: 1
      - run: npm test
        env:
          SKIP_ENV_VALIDATION: 1
